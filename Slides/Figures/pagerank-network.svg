<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="230" viewBox="0 0 360 230" style="background: transparent;">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#6c8ebf"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">

    <!-- nodes: A B C on top row, D E F on bottom row -->
    <g stroke="#6c8ebf" stroke-width="1.5" fill="#dae8fc">
      <circle cx="110" cy="45"  r="23"/>
      <circle cx="205" cy="45"  r="23"/>
      <circle cx="300" cy="45"  r="23"/>
      <circle cx="110" cy="160" r="23"/>
      <circle cx="205" cy="160" r="23"/>
      <circle cx="300" cy="160" r="23"/>
    </g>
    <g fill="#000" font-weight="bold">
      <text x="110" y="51">A</text>
      <text x="205" y="51">B</text>
      <text x="300" y="51">C</text>
      <text x="110" y="166">D</text>
      <text x="205" y="166">E</text>
      <text x="300" y="166">F</text>
    </g>

    <g stroke="#6c8ebf" stroke-width="1.5" fill="none" marker-end="url(#a2)">
      <path d="M133,45  L180,45"/>            <!-- A -> B -->
      <path d="M228,45  L275,45"/>            <!-- B -> C -->
      <path d="M300,68  L300,135"/>           <!-- C -> F -->
      <path d="M188,64  L127,142"/>           <!-- B -> D -->
      <path d="M205,68  L205,135"/>           <!-- B -> E -->
      <path d="M222,64  L283,142"/>           <!-- B -> F -->
      <path d="M133,160 L180,160"/>           <!-- D -> E -->
      <path d="M222,143 L283,66"/>            <!-- E -> C -->
      <path d="M300,183 Q205,215 60,183 Q40,120 88,58"/>  <!-- F -> A -->
    </g>

    <text x="180" y="222" font-size="11.5" fill="#666" font-style="italic">B splits its rank four ways</text>
  </g>
</svg>
