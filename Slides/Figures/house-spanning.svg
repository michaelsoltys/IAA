<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300">
  <rect width="100%" height="100%" fill="white"/>
  <rect x="8" y="8" width="264" height="284" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="288" y="8" width="264" height="284" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="140" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic" font-size="22" fill="#0f172a">G</text>
  <text x="420" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic" font-size="22" fill="#0f172a">T</text>

  <!-- G: house, all six edges -->
  <line x1="140" y1="72" x2="64" y2="148" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="140" y1="72" x2="216" y2="148" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="64" y1="148" x2="216" y2="148" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="64" y1="148" x2="64" y2="244" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="216" y1="148" x2="216" y2="244" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="64" y1="244" x2="216" y2="244" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>

  <circle cx="140" cy="72" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="140" y="77" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1</text>
  <circle cx="64" cy="148" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="64" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2</text>
  <circle cx="216" cy="148" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="216" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3</text>
  <circle cx="64" cy="244" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="64" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4</text>
  <circle cx="216" cy="244" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="216" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">5</text>

  <!-- T: spanning tree {1-2, 1-3, 2-4, 3-5}; unused edges of G ghosted -->
  <line x1="344" y1="148" x2="496" y2="148" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <line x1="344" y1="244" x2="496" y2="244" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <line x1="420" y1="72" x2="344" y2="148" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="420" y1="72" x2="496" y2="148" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="344" y1="148" x2="344" y2="244" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="496" y1="148" x2="496" y2="244" stroke="#0f766e" stroke-width="3.6" stroke-linecap="round"/>

  <circle cx="420" cy="72" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="420" y="77" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">1</text>
  <circle cx="344" cy="148" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="344" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">2</text>
  <circle cx="496" cy="148" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="496" y="153" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">3</text>
  <circle cx="344" cy="244" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="344" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">4</text>
  <circle cx="496" cy="244" r="13" fill="white" stroke="#0f172a" stroke-width="2.1"/>
  <text x="496" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">5</text>

  <text x="140" y="278" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic" font-size="13" fill="#64748b">6 edges</text>
  <text x="420" y="278" text-anchor="middle" font-family="Times New Roman, Times, serif" font-style="italic" font-size="13" fill="#0f766e">n − 1 = 4 edges</text>
</svg>
